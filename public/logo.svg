<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="reelShine" cx="0.35" cy="0.32" r="0.85">
      <stop offset="0%" stop-color="#fff4c1"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="75%" stop-color="#c8941f"/>
      <stop offset="100%" stop-color="#6a4a0a"/>
    </radialGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="55%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#8a8a8a"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0a0"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#a87a1f"/>
    </linearGradient>
  </defs>

  <!-- Film reel (left) -->
  <g transform="translate(50, 50)">
    <ellipse cx="2" cy="36" rx="34" ry="4" fill="rgba(0,0,0,0.5)"/>
    <circle r="34" fill="url(#reelShine)" stroke="#5a4500" stroke-width="1.5"/>
    <circle r="27" fill="none" stroke="#5a4500" stroke-width="0.8" opacity="0.6"/>
    <circle r="8" fill="#0a0500" stroke="#7a5a0f" stroke-width="0.6"/>
    <circle r="3" fill="#ffd700"/>
    <g>
      <circle cx="0" cy="-19" r="6" fill="#0a0500"/>
      <circle cx="0" cy="19" r="6" fill="#0a0500"/>
      <circle cx="-19" cy="0" r="6" fill="#0a0500"/>
      <circle cx="19" cy="0" r="6" fill="#0a0500"/>
    </g>
    <ellipse cx="-11" cy="-15" rx="10" ry="5" fill="white" opacity="0.4"/>
  </g>

  <!-- Curving film strip flowing from reel to right -->
  <path d="M 88 50 Q 110 25 145 35 T 200 55" fill="none" stroke="url(#strip)" stroke-width="7" opacity="0.9" stroke-linecap="round"/>
  <g fill="#0a0500">
    <rect x="92" y="38" width="3.5" height="2.5" rx="0.5"/>
    <rect x="100" y="34" width="3.5" height="2.5" rx="0.5"/>
    <rect x="110" y="30" width="3.5" height="2.5" rx="0.5"/>
    <rect x="120" y="29" width="3.5" height="2.5" rx="0.5"/>
    <rect x="130" y="29" width="3.5" height="2.5" rx="0.5"/>
    <rect x="140" y="31" width="3.5" height="2.5" rx="0.5"/>
    <rect x="150" y="35" width="3.5" height="2.5" rx="0.5"/>
    <rect x="160" y="40" width="3.5" height="2.5" rx="0.5"/>
    <rect x="170" y="44" width="3.5" height="2.5" rx="0.5"/>
    <rect x="180" y="48" width="3.5" height="2.5" rx="0.5"/>
    <rect x="190" y="52" width="3.5" height="2.5" rx="0.5"/>
  </g>

  <!-- "Absolute" — italic, gold, no outline -->
  <text x="210" y="58" font-family="'Brush Script MT', 'Lucida Handwriting', 'Apple Chancery', 'Snell Roundhand', cursive"
        font-size="46" font-style="italic" font-weight="700" fill="url(#textGold)">Absolute</text>

  <!-- "CINEMA" with decorative side lines -->
  <g transform="translate(310, 80)">
    <line x1="-95" y1="0" x2="-50" y2="0" stroke="url(#textGold)" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="13" font-weight="bold" fill="url(#textGold)" letter-spacing="5">CINEMA</text>
    <line x1="50" y1="0" x2="95" y2="0" stroke="url(#textGold)" stroke-width="1.2"/>
  </g>
</svg>
